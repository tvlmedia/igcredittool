<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IronGlass Credit Tracker</title>
    <meta
      name="description"
      content="IronGlass Credit Tracker is a Supabase-backed dashboard app."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060708;
        --panel: rgba(17, 20, 25, 0.82);
        --line: rgba(255, 255, 255, 0.1);
        --gold: #e1b45f;
        --gold-soft: #f4cf86;
        --text: #f7f2e8;
        --muted: rgba(247, 242, 232, 0.62);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(225, 180, 95, 0.12), transparent 30%),
          linear-gradient(220deg, rgba(119, 242, 213, 0.08), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(860px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.035)),
          var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        padding: clamp(28px, 5vw, 56px);
        backdrop-filter: blur(20px);
      }

      .mark {
        width: 48px;
        height: 48px;
        border: 1px solid rgba(225, 180, 95, 0.32);
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: rgba(225, 180, 95, 0.1);
        color: var(--gold-soft);
        font-weight: 800;
      }

      p,
      h1 {
        margin: 0;
      }

      .eyebrow {
        margin-top: 28px;
        color: rgba(244, 207, 134, 0.78);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 10px;
        max-width: 680px;
        font-size: clamp(36px, 7vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .copy {
        margin-top: 20px;
        max-width: 680px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .actions {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        min-height: 44px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        color: inherit;
        text-decoration: none;
        font-size: 14px;
        font-weight: 750;
      }

      .primary {
        background: var(--gold);
        color: #080808;
      }

      .secondary {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">IG</div>
      <p class="eyebrow">IronGlass Credit Tracker</p>
      <h1>Real Supabase data, no hardcoded balances.</h1>
      <p class="copy">
        This repository contains the Next.js app. Deploy it on Vercel and connect
        Supabase environment variables to use the live dashboard.
      </p>
      <div class="actions">
        <a class="primary" href="https://vercel.com/new">Deploy on Vercel</a>
        <a class="secondary" href="https://github.com/tvlmedia/igcredittool">View source</a>
      </div>
    </main>
  </body>
</html>
